name: lint
on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -S warning \
            kernel/build.sh iso/*.sh scripts/*.sh packages/*/build.sh vm/shellos-vm tests/*.sh \
            packages/shellos-*/root/usr/bin/* packages/shellos-*/root/usr/sbin/* \
            packages/shellos-*/root/usr/libexec/shellos/install-bootloader \
            packages/shellos-tuning/root/usr/libexec/shellos/zram-recompress \
            packages/shellos-boot/root/usr/share/initramfs-tools/hooks/* \
            packages/shellos-boot/root/usr/share/initramfs-tools/scripts/local-bottom/* \
            packages/shellos-boot/root/etc/kernel/postinst.d/*

  senpai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc -O2 -Wall -Wextra -Werror -o /dev/null packages/shellos-tuning/src/shellos-senpai.c
      - run: python3 -m py_compile vm/smoke.py packages/shellos-branding/art/generate.py

  kernel-config:
    # Patches apply and every pinned option survives olddefconfig.
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - run: kernel/build.sh --install-deps
      - run: kernel/build.sh --config-only

  rollback:
    # shellos-limine-update + shellos-rollback on a real btrfs loop device,
    # including injected snapshot and menu-update failures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src debian:trixie bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends mmdebstrap btrfs-progs util-linux ca-certificates
            printf stub > /tmp/BOOTX64.EFI
            LIMINE_EFI=/tmp/BOOTX64.EFI tests/rollback.sh'

  limine:
    # The real .deb build on trixie (host tools + firmware stages).
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl build-essential debhelper nasm mtools clang lld llvm
      - uses: actions/checkout@v4
      - run: packages/limine/build.sh
