timeout: 5
interface_branding: ShellOS live
interface_branding_colour: 2EC4B6
wallpaper: boot():/shellos/wallpaper.png

/ShellOS live
    comment: Try ShellOS; install from the "Install ShellOS" app
    protocol: linux
    path: boot():/live/vmlinuz
    module_path: boot():/live/initrd.img
    cmdline: boot=live components quiet splash mitigations=off cpuidle.governor=nap zswap.enabled=0

/ShellOS live (safe mode)
    comment: mitigations on, TEO idle governor, no sched_ext, verbose boot
    protocol: linux
    path: boot():/live/vmlinuz
    module_path: boot():/live/initrd.img
    cmdline: boot=live components cpuidle.governor=teo zswap.enabled=0 systemd.mask=shellos-scx.service

/ShellOS live (copy to RAM)
    comment: load the whole image into memory, then the USB stick can be removed
    protocol: linux
    path: boot():/live/vmlinuz
    module_path: boot():/live/initrd.img
    cmdline: boot=live components toram quiet splash mitigations=off cpuidle.governor=nap zswap.enabled=0
