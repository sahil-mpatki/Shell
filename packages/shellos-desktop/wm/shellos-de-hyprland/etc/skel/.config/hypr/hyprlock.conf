# ShellOS lock screen.
general {
    hide_cursor = true
}
background {
    monitor =
    path = /usr/share/backgrounds/shellos/shellos-spiral.png
    blur_passes = 2
    brightness = 0.6
}
input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 2
    inner_color = rgba(14201fcc)
    outer_color = rgba(2ec4b6ff)
    check_color = rgba(7bd88fff)
    fail_color = rgba(ff6b6bff)
    font_color = rgb(230, 244, 242)
    font_family = JetBrains Mono
    placeholder_text = Password
    fail_text = $PAMFAIL
    rounding = 10
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    font_size = 84
    font_family = JetBrains Mono
    color = rgba(e6f4f2ff)
    position = 0, 120
    halign = center
    valign = center
}
