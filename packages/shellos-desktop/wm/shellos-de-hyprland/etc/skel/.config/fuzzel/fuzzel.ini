# ShellOS launcher (fuzzel, Hyprland).
[main]
font=JetBrains Mono:size=11
terminal=alacritty -e
prompt="› "
width=40
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
background=0b1416f2
text=e6f4f2ff
match=2ec4b6ff
selection=1a4f4aff
selection-text=e6f4f2ff
selection-match=2ec4b6ff
border=2ec4b6ff

[border]
width=2
radius=12
