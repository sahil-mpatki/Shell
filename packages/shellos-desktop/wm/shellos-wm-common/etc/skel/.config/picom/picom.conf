# ShellOS compositor (picom, X11 window managers): light shadows, rounded
# corners, gentle fades. Fullscreen windows are left alone.
backend = "glx";
vsync = true;
corner-radius = 8;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@" ];
fading = true;
fade-delta = 6;
unredir-if-possible = true;
