# ShellOS installer: Btrfs + Snapper layout, Limine bootloader.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: bootloader
  module: shellprocess
  config: shellprocess_bootloader.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - packages
  - shellprocess@bootloader
  - umount
- show:
  - finished

branding: shellos
prompt-install: true
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
