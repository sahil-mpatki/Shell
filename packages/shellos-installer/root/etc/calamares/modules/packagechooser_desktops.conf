# Desktop selection page. Tick any number; each is listed on the login
# screen. COSMIC is on the live image; the others download during install.
---
mode: requiredmultiple
method: legacy
id: desktops

labels:
    step: "Desktops"

items:
    - id: cosmic
      name: "COSMIC"
      description: "System76's modern Rust desktop. Comes with the installer, no download needed."
      selected: true
    - id: pantheon
      name: "Pantheon"
      description: "elementary OS's calm, macOS-like desktop: Gala, Wingpanel, Dock and elementary apps."
    - id: gnome
      name: "GNOME"
      description: "Debian's core GNOME desktop: Activities overview, Files, Settings."
    - id: kde
      name: "KDE Plasma"
      description: "Debian's core Plasma desktop: highly customisable, Windows-like panel."
    - id: hyprland
      name: "Hyprland"
      description: "Animated tiling Wayland compositor, ShellOS-configured: Waybar, fuzzel, hyprlock."
    - id: i3
      name: "i3"
      description: "Classic X11 tiling window manager, ShellOS-configured: i3bar, rofi, dunst, picom."
    - id: dwm
      name: "dwm"
      description: "suckless's minimal dynamic window manager, built with the ShellOS config."
    - id: bspwm
      name: "bspwm"
      description: "Binary-space-partitioning tiling WM, ShellOS-configured: sxhkd, polybar, rofi."
