# Runs inside the target after live packages are gone.
---
dontChroot: false
timeout: 900
script:
    - "-rm -f /etc/systemd/system/cosmic-greeter.service.d/shellos-live.conf /etc/greetd/shellos-live.toml /etc/sudoers.d/shellos-live"
    - command: "update-initramfs -u -k all"
      timeout: 600
    - "/usr/libexec/shellos/install-bootloader"
