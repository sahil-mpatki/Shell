# MGLRU thrashing protection: never evict the working set of the last
# second; OOM instead of livelocking (Yu Zhao's MGLRU design, min_ttl_ms).
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
# THP only where asked (madvise), defrag in the background instead of
# stalling the faulting task.
w- /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w- /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
