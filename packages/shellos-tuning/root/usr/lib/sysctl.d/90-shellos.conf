# ShellOS runtime tuning. Rationale: docs/KERNEL.md ("Runtime tuning").
# Override any of these in /etc/sysctl.d/.

# zram is far cheaper than disk swap: let the kernel prefer swapping cold
# anon pages over dropping page cache (values >100 are valid since 5.8).
vm.swappiness = 180
# zram has no seek cost, so don't read surrounding pages on swap-in.
vm.page-cluster = 0
# Don't boost kswapd on fragmentation events; with MGLRU it just causes
# needless reclaim bursts.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Keep dentries/inodes around longer: big win for file managers and builds.
vm.vfs_cache_pressure = 50
# Flush dirty pages early and in small chunks so copying to a USB stick
# doesn't stall the desktop.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# No NMI watchdog: one less periodic interrupt per CPU, slightly better idle.
kernel.nmi_watchdog = 0
# Alder Lake traps split locks; the default 10ms penalty hurts some games.
kernel.split_lock_mitigate = 0

# Networking: BBR + fq are compiled-in defaults; set explicitly for clarity.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# IDEs and file watchers.
fs.inotify.max_user_watches = 524288
