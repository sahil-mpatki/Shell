# Compressed swap in RAM. lz4 on the hot path (fast), zstd as the secondary
# algorithm that shellos-zram-recompress.timer applies to idle pages.
# No "(level=N)": zram-generator 1.2.1 writes recompression params to the
# `recompress` trigger, which fails before setup; zstd defaults to level 3.
[zram0]
zram-size = ram
compression-algorithm = lz4 zstd
swap-priority = 100
